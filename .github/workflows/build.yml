name: Build Real Climate

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Build and reobfuscate mod
        run: gradle build reobfJar --no-daemon --stacktrace

      - name: Collect final jar
        run: |
          mkdir -p out
          find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -exec cp {} out/ \;
          ls -lh out

      - name: Upload artifact for studio
        uses: actions/upload-artifact@v4
        with:
          name: real_climate-jar
          path: out/*.jar

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.jar \
            --title "Real Climate Build #${{ github.run_number }}" \
            --notes "Автоматическая сборка Real Climate Mod (Forge 1.20.1) #${{ github.run_number }}"
