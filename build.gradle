buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
apply plugin: 'org.spongepowered.mixin'

version = '0.1.24'
group = 'com.realclimate'
base { archivesName = 'real_climate-1.20.1-forge' }

tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'
            mods { real_climate { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'
            mods { real_climate { source sourceSets.main } } }
    }
}

mixin {
    add sourceSets.main, 'real_climate.refmap.json'
    config 'real_climate.mixins.json'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.2'

    // Миксины (осадки по реальной температуре): процессор аннотаций для refmap
    // и библиотека в compile- и runtime-classpath. Без внешних зависимостей у самого мода.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'org.spongepowered:mixin:0.8.5'
    minecraftLibrary 'org.spongepowered:mixin:0.8.5'
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}
